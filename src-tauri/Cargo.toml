[package]
name = "altfileexplorer"
version = "0.2.3"
description = "A fast, dark, keyboard-first file explorer with smart thumbnails and a folder treemap"
authors = ["h3rb"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "altfileexplorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "altfileexplorer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-drag = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dunce = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "ico"] }
blake3 = "1"
walkdir = "2"
ignore = "0.4"
trash = "5"
opener = { version = "0.9", features = ["reveal"] }
arboard = "3"
notify = "8"
flate2 = "1"
bzip2 = "0.6"
sevenz-rust2 = { version = "0.25", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_WNet",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
