name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Package portable build and NSIS installer
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: altfileexplorer-windows
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/AltFileExplorer-*-win-x64.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev build-essential curl wget file
      - name: Package portable build
        run: bash scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: altfileexplorer-linux
          path: |
            dist/*.tar.gz
            dist/AltFileExplorer-*-linux-*
          if-no-files-found: error
